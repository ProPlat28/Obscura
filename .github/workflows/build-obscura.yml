name: Obscura Zero-Error CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # WINDOWS BUILD (MSVC)
  # ==========================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        # FIX: Removed -DCMAKE_POLICY_VERSION_MINIMUM to prevent PowerShell from parsing "3.5" as a file path.
        # The policy is now handled safely inside CMakeLists.txt.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Windows-EXE
          path: build/Release/Obscura.exe
          retention-days: 14

  # ==========================================
  # LINUX BUILD (GCC)
  # ==========================================
  build-linux:
    name: Build Linux (Binary)
    # FIX: Changed from ubuntu-latest (24.04) to ubuntu-22.04. 
    # This prevents the binary from requiring newer glibc/libstdc++ than your local PC has.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake \
            libx11-dev xorg-dev libgl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libasound2-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build build --config Release -j$(nproc)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Linux-Binary
          path: build/Obscura
          retention-days: 14
