name: Obscura CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  Windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install OpenSSL (Fast via Chocolatey)
        run: choco install openssl -y

      - name: Set OpenSSL Path
        shell: pwsh
        run: |
          $opensslPath = Get-ChildItem -Path "C:\Program Files", "C:\tools" -Directory -Filter "OpenSSL*" -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $opensslPath) { $opensslPath = "C:\Program Files\OpenSSL-Win64" }
          echo "OPENSSL_ROOT_DIR=$opensslPath" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        
      - name: Build Project
        run: cmake --build build --config Release
        
      # FIX: Copy the required DLLs next to the .exe so it can launch
      - name: Bundle OpenSSL DLLs
        shell: pwsh
        run: |
          $binPath = Join-Path $env:OPENSSL_ROOT_DIR "bin"
          if (Test-Path $binPath) {
              Copy-Item -Path "$binPath\libssl-*.dll", "$binPath\libcrypto-*.dll" -Destination "build/Release/" -Force
              Write-Host "Successfully copied OpenSSL DLLs to build/Release/"
          } else {
              Write-Host "Warning: Could not find OpenSSL bin directory at $binPath"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Windows
          # FIX: Changed from just the .exe to the whole folder so it includes the DLLs
          path: build/Release/
          retention-days: 14

  Linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libssl-dev \
            libx11-dev xorg-dev libgl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libasound2-dev
            
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        
      - name: Build Project
        run: cmake --build build --config Release -j$(nproc)
        
      - name: Set Execute Permissions
        run: chmod +x build/Obscura

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Linux
          path: build/Obscura
          retention-days: 14

  macOS:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: brew install cmake openssl

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build Project
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-macOS
          path: build/Obscura
          retention-days: 14
