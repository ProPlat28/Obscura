name: Obscura CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  Windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install OpenSSL
        run: |
          C:\vcpkg\vcpkg.exe install openssl:x64-windows
          C:\vcpkg\vcpkg.exe integrate install

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake
        
      - name: Build Project
        run: cmake --build build --config Release
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Windows
          path: build/Release/Obscura.exe
          retention-days: 14

  Linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libssl-dev \
            libx11-dev xorg-dev libgl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libasound2-dev
            
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        
      - name: Build Project
        run: cmake --build build --config Release -j$(nproc)
        
      - name: Set Execute Permissions
        run: chmod +x build/Obscura

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Linux
          path: build/Obscura
          retention-days: 14

  macOS:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install Dependencies
        run: brew install cmake openssl

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build Project
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-macOS
          path: build/Obscura
          retention-days: 14
