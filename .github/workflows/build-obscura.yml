name: Obscura Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # WINDOWS BUILD (MSVC)
  # ==========================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake
        # Removed -G "Visual Studio 17 2022" to let CMake auto-detect the runner's default VS version
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project (Zero-Error Check)
        run: cmake --build build --config Release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Windows-EXE
          path: build/Release/Obscura.exe
          retention-days: 14

  # ==========================================
  # LINUX BUILD (GCC)
  # ==========================================
  build-linux:
    name: Build Linux (Binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies (Raylib Requirements)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake \
            libx11-dev xorg-dev libgl1-mesa-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev \
            libasound2-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project (Zero-Error Check)
        run: cmake --build build --config Release -j$(nproc)

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obscura-Linux-Binary
          path: build/Obscura
          retention-days: 14
